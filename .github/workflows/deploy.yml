name: Deploy Vite site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_PROFILE_EMAIL: ${{ vars.VITE_PROFILE_EMAIL }}
          VITE_PROFILE_LINKEDIN: ${{ vars.VITE_PROFILE_LINKEDIN }}
          VITE_PROFILE_GITHUHB: ${{ vars.VITE_PROFILE_GITHUHB }}
          VITE_PROFILE_X: ${{ vars.VITE_PROFILE_X }}
          VITE_PROFILE_INSTAGRAM: ${{ vars.VITE_PROFILE_INSTAGRAM }}
          VITE_CERTIFICATE_UNIFIEDMENTOR: ${{ vars.VITE_CERTIFICATE_UNIFIEDMENTOR }}
          VITE_CERTIFICATE_GFGDSA: ${{ vars.VITE_CERTIFICATE_GFGDSA }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
